<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="網頁示波器 - 多通道實時波形顯示應用" />
    <title>網頁示波器 v2.0</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>網頁示波器 (多通道)</h1>
    </header>

    <main>
      <section class="waveform-section">
        <canvas id="waveform-canvas" width="600" height="400">
          您的瀏覽器不支援 Canvas 元素。請使用現代瀏覽器。
        </canvas>
      </section>

      <section class="control-panel">
        <!-- 全局控制區 -->
        <div class="global-controls">
          <div class="control-group">
            <label for="play-pause-btn">全局播放控制</label>
            <button id="play-pause-btn" class="btn btn-primary">暫停</button>
          </div>

          <div class="control-group">
            <label for="channel-count-select">通道數選擇</label>
            <select id="channel-count-select">
              <option value="1">1 個通道</option>
              <option value="2">2 個通道</option>
              <option value="3" selected>3 個通道</option>
              <option value="4">4 個通道</option>
              <option value="5">5 個通道</option>
              <option value="6">6 個通道</option>
            </select>
          </div>
        </div>

        <!-- 通道控制容器 -->
        <div id="channels-container" class="channels-container">
          <!-- 通道 1 -->
          <div class="channel-block" data-channel-id="1">
            <div class="channel-header">
              <span class="channel-title">通道 1</span>
              <button
                id="channel-1-toggle"
                class="channel-toggle"
                data-channel-id="1"
              >
                開啟
              </button>
            </div>
            <div class="channel-controls">
              <div class="control-group">
                <label for="channel-1-waveform">波形</label>
                <select
                  id="channel-1-waveform"
                  class="channel-waveform"
                  data-channel-id="1"
                >
                  <option value="sine">正弦波</option>
                  <option value="square">方波</option>
                  <option value="triangle">三角波</option>
                  <option value="noise">噪聲</option>
                </select>
              </div>
              <div class="control-group">
                <label for="channel-1-frequency">頻率</label>
                <div class="slider-container">
                  <input
                    type="range"
                    id="channel-1-frequency"
                    class="slider channel-frequency"
                    data-channel-id="1"
                    min="1"
                    max="10"
                    value="1"
                    step="0.1"
                  />
                  <span class="param-value">
                    <span id="channel-1-frequency-value">1</span> Hz
                  </span>
                </div>
              </div>
              <div class="control-group">
                <label for="channel-1-amplitude">振幅</label>
                <div class="slider-container">
                  <input
                    type="range"
                    id="channel-1-amplitude"
                    class="slider channel-amplitude"
                    data-channel-id="1"
                    min="1"
                    max="100"
                    value="50"
                    step="1"
                  />
                  <span class="param-value">
                    <span id="channel-1-amplitude-value">50</span>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- 通道 2 -->
          <div class="channel-block" data-channel-id="2">
            <div class="channel-header">
              <span class="channel-title">通道 2</span>
              <button
                id="channel-2-toggle"
                class="channel-toggle"
                data-channel-id="2"
              >
                開啟
              </button>
            </div>
            <div class="channel-controls">
              <div class="control-group">
                <label for="channel-2-waveform">波形</label>

                  <option value="square">方波</option>

              </div>
              <div class="control-group">

                <div class="slider-container">
                  <input
                    type="range"
                    id="channel-2-frequency"
                    class="slider channel-frequency"

                    min="1"
                    max="10"
                    value="2"
                    step="0.1"
                  />
                  <span class="param-value">
                    <span id="channel-2-frequency-value">2</span> Hz
                  </span>
                </div>
              </div>
              <div class="control-group">
                <label for="channel-2-amplitude">振幅</label>
                <div class="slider-container">
                  <input
                    type="range"
                    id="channel-2-amplitude"
                    class="slider channel-amplitude"
                    data-channel-id="2"
                    min="1"
                    max="100"
                    value="50"
                    step="1"
                  />
                  <span class="param-value">
                    <span id="channel-2-amplitude-value">50</span>
                  </span>
                </div>
              </div>
            </div>
          </div>

                  <span class="param-value">
                    <span id="channel-3-frequency-value">3</span> Hz

                </div>
              </div>
              <div class="control-group">
                <label for="channel-3-amplitude">振幅</label>
                <div class="slider-container">
                  <input

                    value="50"
                    step="1"
                  />
                  <span class="param-value">
                    <span id="channel-3-amplitude-value">50</span>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- 通道 4 -->

            <div class="channel-header">
              <span class="channel-title">通道 4</span>

              <div class="control-group">

                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- 通道 5 -->
          <div class="channel-block" data-channel-id="5">
            <div class="channel-header">
              <span class="channel-title">通道 5</span>
              <button

            </div>
            <div class="channel-controls">
              <div class="control-group">
                <label for="channel-5-waveform">波形</label>
                <select

                  class="channel-waveform"

                >
                  <option value="sine">正弦波</option>
                  <option value="square">方波</option>

              </div>
              <div class="control-group">
                <label for="channel-5-frequency">頻率</label>
                <div class="slider-container">
                  <input

              <div class="control-group">

            </div>

          <!-- 通道 6 -->
          <div class="channel-block" data-channel-id="6">
            <div class="channel-header">
              <span class="channel-title">通道 6</span>
              <button

            </div>
            <div class="channel-controls">
              <div class="control-group">

      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="網頁示波器 - 實時波形顯示應用">
    <title>網頁示波器</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>網頁示波器</h1>
    </header>

    <main>
        <section class="waveform-section">
            <canvas id="waveform-canvas" width="600" height="400">
                您的瀏覽器不支援 Canvas 元素。請使用現代瀏覽器。
            </canvas>
        </section>

        <section class="control-panel">
            <div class="control-group">
                <label for="play-pause-btn">播放控制</label>
                <button id="play-pause-btn" class="btn btn-primary">暫停</button>
            </div>

            <div class="control-group">
                <label for="waveform-select">波形選擇</label>
                <select id="waveform-select">
                    <option value="sine">正弦波</option>
                    <option value="square">方波</option>
                    <option value="triangle">三角波</option>
                    <option value="noise">噪聲</option>
                </select>
            </div>

            <div class="control-group">
                <label for="frequency-slider">頻率調整</label>
                <div class="slider-container">
                    <input 
                        type="range" 
                        id="frequency-slider" 
                        class="slider" 
                        min="1" 
                        max="10" 
                        value="2" 
                        step="0.1">
                    <span class="param-value">
                        <span id="frequency-value">2</span> Hz
                    </span>
                </div>
            </div>

            <div class="control-group">
                <label for="amplitude-slider">振幅調整</label>
                <div class="slider-container">
                    <input 
                        type="range" 
                        id="amplitude-slider" 
                        class="slider" 
                        min="1" 
                        max="100" 
                        value="50" 
                        step="1">
                    <span class="param-value">
                        <span id="amplitude-value">50</span>
                    </span>
                </div>
            </div>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
